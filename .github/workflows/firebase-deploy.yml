# main'ga har push'da Rejam'ni Firebase Hosting'ga (rejam-2d9f1.web.app) chiqaradi.
# Telefondagi ilova shu manzildan o'rnatilgan — GitHub Pages yangilanishi unga yetib bormaydi (bolim 124).
# Kerakli secret: FIREBASE_SERVICE_ACCOUNT (service account JSON kaliti, rollar: Firebase Hosting Admin, API Keys Viewer).
name: Firebase Hosting deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secret bormi
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret yo'q - deploy o'tkazib yuborildi."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.check.outputs.ok == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: rejam-2d9f1
          channelId: live
