<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Rejam</title>
<meta name="theme-color" content="#F4ECDF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rejam">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script src="sync-engine.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // Yangi versiya o'rnatilganda sahifa o'zi bir marta yangilanadi (ikkinchi marta ochish shart emas).
  // Oyna ochiq bo'lsa (matn yozilayotgan bo'lishi mumkin) — yopilguncha kutadi, yozilgan narsa yo'qolmaydi.
  const hadController = !!navigator.serviceWorker.controller;
  let swReloaded = false;
  const swReloadWhenIdle = () => {
    if (swReloaded) return;
    if (document.querySelector('.rp-modal-overlay')) { setTimeout(swReloadWhenIdle, 1500); return; }
    swReloaded = true; location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) swReloadWhenIdle(); });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));
}
</script>
</body>
</html>
